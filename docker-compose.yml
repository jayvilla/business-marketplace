# Local PostgreSQL only. The user and password are development defaults,
# not production secrets. Override the host port with POSTGRES_PORT.
# Production sets ConnectionStrings__DefaultConnection outside this file.

services:
  postgres:
    image: postgres:17
    container_name: business-marketplace-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: business_marketplace
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - business_marketplace_postgres:/var/lib/postgresql/data

volumes:
  business_marketplace_postgres:
