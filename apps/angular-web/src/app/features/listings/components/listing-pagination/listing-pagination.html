<nav class="pagination" aria-label="Pagination">
  <button
    type="button"
    (click)="go(previousTarget())"
    [disabled]="page() <= 1"
  >
    Previous page
  </button>
  <p>
    Page {{ page() }} of {{ pageCount() }}
  </p>
  <button
    type="button"
    (click)="go(page() + 1)"
    [disabled]="page() >= pageCount()"
  >
    Next page
  </button>
</nav>
