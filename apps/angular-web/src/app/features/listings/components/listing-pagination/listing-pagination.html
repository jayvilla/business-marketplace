<nav class="pagination" aria-label="Pagination">
  <button
    type="button"
    (click)="go(previousTarget())"
    [disabled]="pending() || page() <= 1"
  >
    Previous page
  </button>
  @if (pending()) {
    <p>Loading page {{ page() }}</p>
  } @else {
    <p>Page {{ page() }} of {{ pageCount() }}</p>
  }
  <button
    type="button"
    (click)="go(page() + 1)"
    [disabled]="pending() || page() >= pageCount()"
  >
    Next page
  </button>
</nav>
